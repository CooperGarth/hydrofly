name: Verify HydroFly
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  numerical-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev-lock.txt
      - run: pip install --no-deps -e .
      - run: pytest -q --junitxml=artifacts/tests.xml
      - run: python scripts/diagnostics.py
      - run: python scripts/learning_diagnostics.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: node --test web/game-loop.test.js web/plan.test.js
      - run: npm run build --prefix web
      - run: python scripts/smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: hydrofly-numerical-evidence
          path: artifacts/
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hydrofly .
