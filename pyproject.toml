[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrofly"
version = "0.2.0"
description = "Can a fruit fly dewater a mine? An analytical groundwater experiment."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["timflow==0.5.0", "numpy>=2.2,<3", "scipy>=1.15,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "anaflow==1.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
